[package]
name = "heavy-cmd"
version = "0.3.0"
description = "Run a heavy command once the machine has room: one machine-wide queue for every agent and project."
license = "MIT"
repository = "https://github.com/Ploppy3/heavy-cmd"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
