name: release

# A v* tag publishes a GitHub release of that commit, once the checks pass,
# with heavy-cmd.tar.gz: what install.sh and heavy-cmd update install.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: The tag is package.json's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run pack:release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" heavy-cmd.tar.gz --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
